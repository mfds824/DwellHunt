
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DwellHunt Supabase Test</title>
</head>
<body>
  <h2>DwellHunt Supabase Connection Test</h2>
  <p id="result">Testing connection...</p>

  <script type="module">
    import { supabase } from "./supabase-config.js";

    const result = document.getElementById("result");

    try {
      const { data, error } = await supabase
        .from("properties")
        .select("id")
        .eq("status", "published")
        .limit(1);

      if (error) {
        result.textContent = "Error: " + error.message;
      } else {
        result.textContent =
          "SUCCESS! Supabase connection working.";
      }
    } catch (err) {
      result.textContent = "Error: " + err.message;
    }
  </script>
</body>
</html>
