  <!-- DwellHunt Floating Chat Buttons -->
    <style>
      #dwellhunt-chat {
        position: fixed;
        /* Bottom-right corner (the floating assistant button that sat below it was removed). */
        right: 24px;
        bottom: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
      }
      #dwellhunt-chat a {
        display: flex;
        align-items: center;
        height: 52px;
        min-width: 52px;
        padding: 0 15px;
        border-radius: 999px;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }
      #dwellhunt-chat a:hover,
      #dwellhunt-chat a:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(0, 0, 0, 0.25);
      }
      #dwellhunt-chat .dh-whatsapp { background: #25D366; }
      #dwellhunt-chat .dh-telegram { background: #229ED9; }
      #dwellhunt-chat svg { width: 22px; height: 22px; flex-shrink: 0; }
      #dwellhunt-chat .dh-label {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        transition: max-width 0.25s ease, margin 0.25s ease;
      }
      #dwellhunt-chat a:hover .dh-label,
      #dwellhunt-chat a:focus-visible .dh-label {
        max-width: 140px;
        margin-left: 10px;
      }
      #dh-chat-options { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      #dh-chat-options[hidden] { display: none; }
      #dh-chat-options .dh-label { max-width: 140px; margin-left: 10px; }
      .dh-chat-toggle {
        display: grid; place-items: center; width: 54px; height: 54px; border: 0; border-radius: 999px; cursor: pointer;
        background: #0b2a4a; color: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22); transition: transform 0.2s;
      }
      .dh-chat-toggle:hover, .dh-chat-toggle:focus-visible { transform: translateY(-2px); }
      .dh-chat-toggle svg { width: 24px; height: 24px; }
      .dh-chat-close { display: none; font-size: 28px; line-height: 1; }
      .dh-chat-open .dh-chat-toggle svg { display: none; }
      .dh-chat-open .dh-chat-close { display: block; }
      @media (max-width: 480px) {
        #dwellhunt-chat { right: 27px; bottom: 90px; gap: 8px; }
        #dwellhunt-chat a { height: 48px; min-width: 48px; padding: 0 13px; }
      }
    </style>

    <div id="dwellhunt-chat" aria-label="Contact DwellHunt">
      <div id="dh-chat-options" hidden>
        <a
          class="dh-whatsapp"
          href="https://wa.me/94770153678?text=Hi%20DwellHunt%2C%20I%27m%20interested%20in%20a%20property."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Chat with DwellHunt on WhatsApp"
          title="WhatsApp Us"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-4.95A8.5 8.5 0 1 1 7.9 19.4L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .75a4 4 0 0 1-1.75-1.75l.75-1-1-2L9 9.5z"/></svg>
          <span class="dh-label">WhatsApp Us</span>
        </a>
        <a
          class="dh-telegram"
          href="https://t.me/si2021_automation_bot"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Chat with DwellHunt on Telegram"
          title="Telegram Us"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          <span class="dh-label">Telegram Us</span>
        </a>
      </div>
      <button type="button" class="dh-chat-toggle" aria-expanded="false" aria-controls="dh-chat-options" aria-label="Chat with DwellHunt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>
        <span class="dh-chat-close" aria-hidden="true">×</span>
      </button>
    </div>
    <script>
      // One quiet chat button; WhatsApp and Telegram appear only when it is opened.
      (function () {
        var box = document.getElementById("dwellhunt-chat"), toggle = box.querySelector(".dh-chat-toggle"), options = document.getElementById("dh-chat-options");
        function set(open) { options.hidden = !open; toggle.setAttribute("aria-expanded", String(open)); box.classList.toggle("dh-chat-open", open); }
        toggle.addEventListener("click", function () { set(options.hidden); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !options.hidden) { set(false); toggle.focus(); } });
        document.addEventListener("click", function (e) { if (!options.hidden && !box.contains(e.target)) set(false); });
      })();
    </script>
