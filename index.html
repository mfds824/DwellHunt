<!-- DwellHunt Floating Chat Buttons -->
<style>
  #dwellhunt-chat {
    position: fixed;
    right: 20px;
    bottom: 22px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: Arial, sans-serif;
  }

  #dwellhunt-chat a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 17px;
    border-radius: 30px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  #dwellhunt-chat a:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(0, 0, 0, 0.25);
  }

  #dwellhunt-chat .dh-whatsapp {
    background: #25D366;
  }

  #dwellhunt-chat .dh-telegram {
    background: #229ED9;
  }

  #dwellhunt-chat .dh-icon {
    font-size: 21px;
    line-height: 1;
  }

  @media (max-width: 480px) {
    #dwellhunt-chat {
      right: 12px;
      bottom: 14px;
      gap: 9px;
    }

    #dwellhunt-chat a {
      padding: 11px 14px;
      font-size: 13px;
    }
  }
</style>

<div id="dwellhunt-chat" aria-label="Contact DwellHunt">
  <a
    class="dh-whatsapp"
    href="https://wa.me/94770153678?text=Hi%20DwellHunt%2C%20I%27m%20interested%20in%20a%20property."
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat with DwellHunt on WhatsApp"
  >
    <span class="dh-icon" aria-hidden="true">◉</span>
    <span>WhatsApp Us</span>
  </a>

  <a
    class="dh-telegram"
    href="https://t.me/sebestian moran"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat with DwellHunt on Telegram"
  >
    <span class="dh-icon" aria-hidden="true">➤</span>
    <span>Telegram Us</span>
  </a>
</div>
